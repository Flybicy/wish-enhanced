name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build when not running from a tag push
        required: false
        type: string

permissions:
  contents: write

jobs:
  web:
    name: Build the web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wish-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: wish-web/dist
          if-no-files-found: error

  build:
    name: Archive ${{ matrix.target }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          package="wish-enhanced-${version}-${target}"
          staging="dist/${package}"
          exe=""
          if [[ "$target" == *windows* ]]; then
            exe=".exe"
          fi
          mkdir -p "$staging"
          cp "target/${target}/release/wish${exe}" "$staging/"
          cp -R web "$staging/web"
          cp LICENSE README.md "$staging/"
          if [[ "$target" == *windows* ]]; then
            # Python writes the `/` separators zip requires; Compress-Archive writes `\`.
            (cd dist && python -m zipfile -c "${package}.zip" "$package")
            archive="dist/${package}.zip"
          else
            tar -czf "dist/${package}.tar.gz" -C dist "$package"
            archive="dist/${package}.tar.gz"
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wish-win-msvc-${{ hashFiles('**/Cargo.lock') }}

      - name: Build wish-core (release)
        run: cargo build --release

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: wish-web/dist

      - name: Download niubash release binaries
        run: |
          $api = Invoke-RestMethod "https://api.github.com/repos/unixwin/niubash/releases/latest"
          $asset = $api.assets | Where-Object { $_.name -match "x86_64.*\.zip$" -or $_.name -match "x64.*\.zip$" } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\niubash.zip"
            Expand-Archive "$env:TEMP\niubash.zip" -DestinationPath "$env:TEMP\niubash"
            New-Item -ItemType Directory -Force -Path dist/niubash | Out-Null
            $nested = Get-ChildItem "$env:TEMP\niubash" -Directory | Select-Object -First 1
            if ($nested -and (Test-Path (Join-Path $nested.FullName "niu.exe"))) {
              Copy-Item "$($nested.FullName)/*" dist/niubash -Recurse -Force
            } else {
              Copy-Item "$env:TEMP\niubash/*" dist/niubash -Recurse -Force
            }
          } else {
            Write-Host "::warning::no niubash x64 asset found; building from source"
            git clone --depth 1 https://github.com/unixwin/niubash.git niubash-src
            cargo build --release --manifest-path niubash-src/Cargo.toml
            New-Item -ItemType Directory -Force -Path dist/niubash | Out-Null
            Copy-Item "niubash-src/target/release/*.exe" dist/niubash -ErrorAction SilentlyContinue
          }

      - name: Bundle Python and document libraries
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.2/python-3.13.2-embed-amd64.zip" -OutFile "${env:TEMP}\python-embed.zip"
          Expand-Archive "${env:TEMP}\python-embed.zip" dist/wish/python
          $pth = Get-ChildItem dist/wish/python/*._pth | Select-Object -First 1
          (Get-Content $pth.FullName -Raw) -replace '#import site', 'import site' | Set-Content $pth.FullName -NoNewline
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "${env:TEMP}\get-pip.py"
          dist/wish/python/python.exe "${env:TEMP}\get-pip.py" --no-warn-script-location
          dist/wish/python/python.exe -m pip install --no-warn-script-location python-docx openpyxl python-pptx pypdf reportlab markdown
          dist/wish/python/python.exe -c "import docx, openpyxl, pptx, pypdf, reportlab, markdown; print('bundled python OK')"

      - name: Bundle Node.js and MinGit
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip" -OutFile "${env:TEMP}\node.zip"
          Expand-Archive "${env:TEMP}\node.zip" "$env:TEMP\node"
          $dir = Get-ChildItem "$env:TEMP\node" -Directory | Select-Object -First 1
          Move-Item $dir.FullName dist/wish/node
          Invoke-WebRequest -Uri "https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/MinGit-2.47.1-64-bit.zip" -OutFile "${env:TEMP}\mingit.zip"
          Expand-Archive "${env:TEMP}\mingit.zip" dist/wish/git
          dist/wish/node/node.exe -e "console.log('bundled node', process.version)"
          dist/wish/git/cmd/git.exe --version

      - name: Assemble distribution
        run: |
          New-Item -ItemType Directory -Force -Path dist/wish | Out-Null
          Copy-Item target/release/wish.exe dist/wish/
          Copy-Item installer/WebView2Loader.dll dist/wish/
          Copy-Item installer/wish.ico dist/wish/
          if (Test-Path dist/niubash/niu.exe) {
            Move-Item dist/niubash dist/wish/niubash -Force
          }

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/wish.iss
          options: /Odist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wish-installer
          path: |
            dist/wish-setup-*.exe
            dist/wish/**

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wish-setup-*.exe
