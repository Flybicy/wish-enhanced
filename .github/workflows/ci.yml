name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wish-ci-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test
        run: cargo test --bins

      - name: Typecheck wish-web
        run: |
          npm i -g pnpm@12
          cd wish-web
          pnpm install --frozen-lockfile
          pnpm run typecheck

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wish-macos-ci-${{ hashFiles('**/Cargo.lock') }}

      # Minimal macOS guard: compiles and runs the same unit tests as Windows,
      # which covers the per-platform user dir and browser command mapping.
      - name: cargo test
        run: cargo test --bins
